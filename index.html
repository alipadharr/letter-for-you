<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

.card{
    background:#fff;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    max-width:500px;
    width:90%;
}

h2{
    color:#ff4d6d;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:#ff4d6d;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#ff2e5f;
}

#text{
    margin-top:20px;
    white-space:pre-line;
    font-size:18px;
    line-height:1.7;
    color:#444;
}
</style>

</head>
<body>

<div class="card">
    <h2>❤️ Open My Letter ❤️</h2>

    <button onclick="showLetter()">Open</button>

    <div id="text"></div>
</div>

<script>

const message = `Hai Sayang ❤️

Terima kasih sebab masih ada dengan saya.

Awak ialah orang yang paling saya hargai.

Semoga hubungan kita berkekalan sampai tua.

I love you so much ❤️`;

function showLetter() {
    let i = 0;
    const text = document.getElementById("text");
    text.innerHTML = "";

    const typing = setInterval(function() {
        text.innerHTML += message.charAt(i);
        i++;

        if (i >= message.length) {
            clearInterval(typing);
        }
    }, 50);
}

</script>

</body>
</html>
